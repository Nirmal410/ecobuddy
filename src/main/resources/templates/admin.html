<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Eco Shop</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header>
        <div class="container">
            <h1>🔧 Admin Panel</h1>
            <nav>
                <a th:href="@{/dashboard}">Dashboard</a>
                <a th:href="@{/search}">Search</a>
                <a th:href="@{/logout}">Logout</a>
            </nav>
        </div>
    </header>

    <section class="admin-section">
        <div class="container">
            <div class="admin-header">
                <h2>Manage Products</h2>
                <a th:href="@{/admin/product/new}" class="btn-primary">Add New Product</a>
            </div>

            <div class="products-table">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Normal Product</th>
                            <th>Eco Alternative</th>
                            <th>Category</th>
                            <th>Eco Price</th>
                            <th>CO2 Saved</th>
                            <th>Plastic Saved</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="product : ${products}">
                            <td th:text="${product.id}">1</td>
                            <td th:text="${product.normalProduct}">Plastic Bottle</td>
                            <td th:text="${product.ecoAlternative}">Reusable Bottle</td>
                            <td th:text="${product.category}">Kitchen</td>
                            <td>$<span th:text="${product.ecoPrice}">0</span></td>
                            <td th:text="${product.co2SavedPerUnit} + ' kg'">0 kg</td>
                            <td th:text="${product.plasticSavedPerUnit} + ' kg'">0 kg</td>
                            <td>
                                <a th:href="@{'/admin/product/edit/' + ${product.id}}" class="btn-small">Edit</a>
                                <a th:href="@{'/admin/product/delete/' + ${product.id}}" 
                                   class="btn-small btn-danger"
                                   onclick="return confirm('Are you sure you want to delete this product?')">Delete</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
                
                <p th:if="${products.isEmpty()}">No products available. Add your first eco-friendly product!</p>
            </div>
        </div>
    </section>
</body>
</html>
