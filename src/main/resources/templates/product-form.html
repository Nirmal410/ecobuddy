<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Form - Eco Shop</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header>
        <div class="container">
            <h1>🌍 Product Management</h1>
            <nav>
                <a th:href="@{/admin}">Back to Admin</a>
            </nav>
        </div>
    </header>

    <section class="form-section">
        <div class="container">
            <h2 th:text="${product.id != null ? 'Edit Product' : 'Add New Product'}">Product Form</h2>
            
            <form th:action="@{/admin/product/save}" method="post" th:object="${product}" class="product-form">
                <input type="hidden" th:field="*{id}">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="normalProduct">Normal Product Name *</label>
                        <input type="text" id="normalProduct" th:field="*{normalProduct}" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="ecoAlternative">Eco-Friendly Alternative *</label>
                        <input type="text" id="ecoAlternative" th:field="*{ecoAlternative}" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" th:field="*{description}" rows="4"></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" th:field="*{category}">
                            <option value="">Select Category</option>
                            <option value="Kitchen">Kitchen</option>
                            <option value="Bathroom">Bathroom</option>
                            <option value="Food">Food</option>
                            <option value="Clothing">Clothing</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="imageUrl">Image URL</label>
                        <input type="text" id="imageUrl" th:field="*{imageUrl}">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="normalPrice">Normal Product Price ($)</label>
                        <input type="number" step="0.01" id="normalPrice" th:field="*{normalPrice}">
                    </div>
                    
                    <div class="form-group">
                        <label for="ecoPrice">Eco Product Price ($)</label>
                        <input type="number" step="0.01" id="ecoPrice" th:field="*{ecoPrice}">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="purchaseLink">Purchase Link (URL to buy online)</label>
                    <input type="url" id="purchaseLink" th:field="*{purchaseLink}">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="co2SavedPerUnit">CO2 Saved Per Unit (kg)</label>
                        <input type="number" step="0.01" id="co2SavedPerUnit" th:field="*{co2SavedPerUnit}">
                    </div>
                    
                    <div class="form-group">
                        <label for="plasticSavedPerUnit">Plastic Saved Per Unit (kg)</label>
                        <input type="number" step="0.01" id="plasticSavedPerUnit" th:field="*{plasticSavedPerUnit}">
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Save Product</button>
                    <a th:href="@{/admin}" class="btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </section>
</body>
</html>
